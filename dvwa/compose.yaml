services:
  dvwa:
    image: ghcr.io/digininja/dvwa@sha256:ed35515e9111801e6e386a6fbb11165508cc7f72e0cb8da4dbb3df70182986c6
    environment:
      DB_SERVER: db
      DEFAULT_SECURITY_LEVEL: ${DVWA_SECURITY_LEVEL:-low}
    depends_on:
      - db
    ports:
      - "127.0.0.1:4280:80"
    restart: unless-stopped

  db:
    image: mariadb@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    environment:
      MYSQL_ROOT_PASSWORD: dvwa-local-only
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - dvwa_db:/var/lib/mysql
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: ["zap"]
    environment:
      DVWA_USERNAME: ${DVWA_USERNAME:-admin}
      DVWA_PASSWORD: ${DVWA_PASSWORD:-password}
      ZAP_PLAN_FILE: ${ZAP_PLAN_FILE:-zap-auth.template.yaml}
    volumes:
      - ../results/zap:/zap/out:rw
    command: ["zap.sh", "-cmd", "-autorun", "/zap/out/${ZAP_PLAN_FILE:-zap-auth.template.yaml}"]
    depends_on:
      - dvwa
    restart: "no"

  zap-api:
    image: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    profiles: ["zap-api"]
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?A temporary ZAP_API_KEY must be provided}
      ZAP_API_PORT: "8080"
      DVWA_USERNAME: ${DVWA_USERNAME:-admin}
      DVWA_PASSWORD: ${DVWA_PASSWORD:-password}
    volumes:
      - ../results/zap:/zap/out:rw
    command:
      - sh
      - -c
      - >-
        exec zap.sh -daemon -host 0.0.0.0 -port 8080
        -config api.key=$${ZAP_API_KEY}
        -config api.addrs.addr.name=.*
        -config api.addrs.addr.regex=true
    depends_on:
      - dvwa
    restart: "no"

  gateway:
    image: python:3.12-alpine
    profiles: ["tunnel"]
    command: ["python", "/app/gateway.py"]
    environment:
      LAB_TOKEN: ${LAB_TOKEN:-missing}
    volumes:
      - ./gateway.py:/app/gateway.py:ro
    depends_on:
      - dvwa
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:8080"]
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  dvwa_db:
