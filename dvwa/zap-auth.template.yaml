---
env:
  contexts:
    - name: dvwa-sqli
      urls:
        - http://dvwa/login.php
        - http://dvwa/vulnerabilities/sqli/
        - http://dvwa/vulnerabilities/sqli_blind/
        - http://dvwa/vulnerabilities/sqli/session-input.php
        - http://dvwa/vulnerabilities/sqli_blind/cookie-input.php
      includePaths:
        - '^http://dvwa/(login\.php(\?.*)?|vulnerabilities/(sqli|sqli_blind)(/(session-input|cookie-input)\.php)?/?(\?.*)?)$'
      excludePaths:
        - '^http://dvwa/login\.php\?logout$'
      authentication:
        method: form
        parameters:
          loginPageUrl: http://dvwa/login.php
          loginRequestUrl: http://dvwa/login.php
          loginRequestBody: 'username={%username%}&password={%password%}&Login=Login&user_token={%user_token%}'
        verification:
          method: response
          loggedInRegex: 'Logout'
          loggedOutRegex: 'name="username"'
      sessionManagement:
        method: cookie
      users:
        - name: dvwa-local-user
          credentials:
            username: ${dvwaUser}
            password: ${dvwaPassword}
  vars:
    dvwaUser: ${DVWA_USERNAME}
    dvwaPassword: ${DVWA_PASSWORD}
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  # DVWA stores the security level in the session cookie. Set it explicitly
  # for ZAP's own authenticated session; the user's browser session is separate.
  - type: requestor
    parameters:
      user: dvwa-local-user
    requests:
      - name: Set DVWA security level to High for the ZAP session
        url: http://dvwa/security.php
        method: POST
        data: 'security=high&seclev_submit=Submit'
        responseCode: 200
  - type: spider
    parameters:
      context: dvwa-sqli
      user: dvwa-local-user
      url: http://dvwa/vulnerabilities/sqli/
      maxDuration: 2
      maxDepth: 5
      maxChildren: 20
      logoutAvoidance: true
      postForm: true
      processForm: true
  # Popup helpers used by DVWA at High: seed them explicitly so their POST
  # forms are mapped even when the popup JavaScript is not traversed.
  - type: spider
    parameters:
      context: dvwa-sqli
      user: dvwa-local-user
      url: http://dvwa/vulnerabilities/sqli/session-input.php
      maxDuration: 1
      maxDepth: 2
      maxChildren: 10
      logoutAvoidance: true
      postForm: true
      processForm: true
  - type: spider
    parameters:
      context: dvwa-sqli
      user: dvwa-local-user
      url: http://dvwa/vulnerabilities/sqli_blind/cookie-input.php
      maxDuration: 1
      maxDepth: 2
      maxChildren: 10
      logoutAvoidance: true
      postForm: true
      processForm: true
  # Client Spider can traverse DOM-driven links/popups; keep it passive and
  # bounded for this local DVWA lab.
  - type: spiderClient
    parameters:
      context: dvwa-sqli
      user: dvwa-local-user
      url: http://dvwa/vulnerabilities/sqli/
      maxDuration: 1
      maxCrawlDepth: 3
      maxChildren: 10
      numberOfBrowsers: 1
      browserId: firefox-headless
      scopeCheck: Strict
  - type: spiderClient
    parameters:
      context: dvwa-sqli
      user: dvwa-local-user
      url: http://dvwa/vulnerabilities/sqli_blind/
      maxDuration: 1
      maxCrawlDepth: 3
      maxChildren: 10
      numberOfBrowsers: 1
      browserId: firefox-headless
      scopeCheck: Strict
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/
      reportFile: zap-auth-2026-10-01.json
